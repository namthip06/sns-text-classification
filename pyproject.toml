[project]
name = "textcls"
version = "0.1.0"
description = "Local Thai Twitter text classifier (18 categories) with weak-label gating"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.20.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
]
