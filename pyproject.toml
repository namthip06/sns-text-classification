[project]
name = "textcls"
version = "0.1.0"
description = "Local Thai Twitter text classifier (18 categories) with weak-label gating"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "pandas>=3.0.5",
    "protobuf>=7.36.0",  # transformers ใช้สกัด SentencePiece model ของ WangchanBERTa
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",  # transformers ใช้เป็น fallback ตอนสกัด tokenizer
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
]
